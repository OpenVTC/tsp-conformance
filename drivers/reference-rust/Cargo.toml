[package]
name = "tsp-conformance-driver-reference"
version = "0.1.0"
edition = "2024"
publish = false
description = "TSP conformance driver for the ToIP reference implementation (tsp_sdk)"

# Standalone: never resolved together with another implementation's graph.
[workspace]

[[bin]]
name = "tsp-driver-reference"
path = "src/main.rs"

[dependencies]
# 0.16.0 is the first release at TSP 1.0 (YTSP-BAA); 0.11.0–0.15.x emitted Rev 3's YTSP-AAC.
# `async` (the default) drags in askar/tokio/transports that stateless and
# SecureStore ops do not need.
tsp_sdk = { version = "=0.16.0", default-features = false, features = ["serialize", "nacl", "pq"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
